# ==============================================================
# Render Infrastructure Blueprint for Aashray'sPA Backend
# Ref: https://render.com/docs/blueprint-spec
# ==============================================================

version: "1"

services:
  # ── FastAPI Backend Web Service ──────────────────────────────
  - type: web
    name: aashrays-pa-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: aashrays-pa-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_BUSINESS_PHONE_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_API_VERSION
        value: v21.0
      - key: INSTAGRAM_VERIFY_TOKEN
        generateValue: true
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  # ── Render Managed PostgreSQL Database ───────────────────────
  - name: aashrays-pa-db
    plan: starter
    region: oregon
    databaseName: aashrays_pa
    user: aashray

